<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>3D Printing</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#14161b">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="3D Printing">
<meta name="description" content="Sales & expense tracker for a small 3D printing business (MVR)">
<style>
@import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap');

:root{
  --bg:#14161b;
  --surface:#1c1f26;
  --surface-2:#242830;
  --border:#2e323c;
  --text:#f2f1ed;
  --text-muted:#9195a0;
  --orange:#ff6b35;
  --teal:#2ec4b6;
  --success:#4caf7d;
  --danger:#e85d5d;
  --font-display:'Space Grotesk',sans-serif;
  --font-body:'Inter',-apple-system,BlinkMacSystemFont,sans-serif;
  --font-mono:'JetBrains Mono',ui-monospace,monospace;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  overscroll-behavior-y:none;
  -webkit-font-smoothing:antialiased;
}

#app{
  max-width:480px;
  margin:0 auto;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  position:relative;
}

/* ---------- Topbar ---------- */
.topbar{
  padding:calc(env(safe-area-inset-top) + 18px) 20px 14px;
  display:flex;
  align-items:baseline;
  justify-content:space-between;
  border-bottom:1px solid var(--border);
  background:var(--bg);
  position:sticky;
  top:0;
  z-index:10;
}
.topbar .brand{
  font-family:var(--font-display);
  font-weight:700;
  font-size:19px;
  letter-spacing:-0.01em;
}
.topbar .brand span{color:var(--orange);}
.topbar .subtitle{
  font-size:11px;
  color:var(--text-muted);
  font-family:var(--font-mono);
  letter-spacing:0.02em;
}

/* ---------- Main ---------- */
main{
  flex:1;
  padding:18px 16px calc(96px + env(safe-area-inset-bottom));
  animation:fadein .22s ease;
}
@keyframes fadein{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}

.section-label{
  font-family:var(--font-mono);
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:0.08em;
  color:var(--text-muted);
  margin:22px 4px 10px;
}
.section-label:first-child{margin-top:0;}

/* ---------- Gauge card ---------- */
.gauge-card{
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:22px 20px;
  display:flex;
  align-items:center;
  gap:20px;
}
.gauge-wrap{position:relative;width:112px;height:112px;flex-shrink:0;}
.gauge-wrap svg{transform:rotate(-90deg);}
.gauge-center{
  position:absolute;inset:0;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.gauge-center .label{font-size:9px;color:var(--text-muted);font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.06em;}
.gauge-center .pct{font-family:var(--font-mono);font-weight:700;font-size:20px;margin-top:2px;}

.gauge-figures{flex:1;min-width:0;}
.gauge-figures .month{font-family:var(--font-display);font-weight:600;font-size:15px;margin-bottom:10px;}
.figure-row{display:flex;justify-content:space-between;align-items:center;padding:5px 0;}
.figure-row .k{font-size:12px;color:var(--text-muted);}
.figure-row .v{font-family:var(--font-mono);font-weight:600;font-size:14px;}
.v.pos{color:var(--success);}
.v.neg{color:var(--danger);}

/* ---------- Quick actions ---------- */
.quick-actions{display:flex;gap:10px;margin-top:16px;}
.qa-btn{
  flex:1;
  border:1px solid var(--border);
  background:var(--surface);
  border-radius:16px;
  padding:16px 10px;
  display:flex;flex-direction:column;align-items:center;gap:8px;
  color:var(--text);
  font-family:var(--font-body);
  font-weight:600;
  font-size:13px;
  cursor:pointer;
}
.qa-btn.sale{border-color:rgba(255,107,53,0.35);}
.qa-btn.expense{border-color:rgba(46,196,182,0.35);}
.qa-btn .qa-icon{
  width:34px;height:34px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
}
.qa-btn.sale .qa-icon{background:rgba(255,107,53,0.14);color:var(--orange);}
.qa-btn.expense .qa-icon{background:rgba(46,196,182,0.14);color:var(--teal);}

/* ---------- Category bars ---------- */
.cat-list{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:6px 16px;}
.cat-row{padding:12px 0;border-bottom:1px solid var(--border);}
.cat-row:last-child{border-bottom:none;}
.cat-row-top{display:flex;justify-content:space-between;font-size:13px;margin-bottom:7px;}
.cat-row-top .name{font-weight:500;}
.cat-row-top .amt{font-family:var(--font-mono);color:var(--text-muted);}
.cat-bar-track{height:6px;border-radius:4px;background:var(--surface-2);overflow:hidden;}
.cat-bar-fill{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--orange),#ffb37a);}
.empty-note{color:var(--text-muted);font-size:13px;text-align:center;padding:18px 8px;}

/* ---------- Forms ---------- */
.form-card{background:var(--surface);border:1px solid var(--border);border-radius:18px;padding:18px;}
.field{margin-bottom:16px;}
.field label{display:block;font-size:12px;color:var(--text-muted);margin-bottom:7px;font-family:var(--font-mono);text-transform:uppercase;letter-spacing:.04em;}
.field input, .field select{
  width:100%;
  background:var(--surface-2);
  border:1px solid var(--border);
  border-radius:12px;
  padding:13px 14px;
  color:var(--text);
  font-family:var(--font-body);
  font-size:15px;
  appearance:none;
  -webkit-appearance:none;
}
.field select{
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%239195a0' stroke-width='2'><path d='M6 9l6 6 6-6'/></svg>");
  background-repeat:no-repeat;
  background-position:right 14px center;
  padding-right:36px;
}
.field input:focus, .field select:focus{outline:2px solid var(--orange);outline-offset:0;}
.row-2{display:flex;gap:12px;}
.row-2 .field{flex:1;}

.total-preview{
  display:flex;justify-content:space-between;align-items:center;
  background:var(--surface-2);border-radius:12px;padding:14px 16px;margin-bottom:16px;
}
.total-preview .k{font-size:12px;color:var(--text-muted);}
.total-preview .v{font-family:var(--font-mono);font-weight:700;font-size:18px;}

.submit-btn{
  width:100%;
  border:none;
  border-radius:14px;
  padding:15px;
  font-family:var(--font-body);
  font-weight:600;
  font-size:15px;
  color:#14161b;
  cursor:pointer;
}
.submit-btn.sale{background:var(--orange);}
.submit-btn.expense{background:var(--teal);}

.toast{
  position:fixed;
  bottom:calc(96px + env(safe-area-inset-bottom));
  left:50%;
  transform:translateX(-50%) translateY(10px);
  background:var(--surface-2);
  border:1px solid var(--border);
  color:var(--text);
  padding:10px 18px;
  border-radius:30px;
  font-size:13px;
  opacity:0;
  transition:opacity .2s ease, transform .2s ease;
  pointer-events:none;
  z-index:50;
  max-width:calc(480px - 40px);
  text-align:center;
}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

/* ---------- History ---------- */
.filter-tabs{display:flex;gap:8px;margin-bottom:16px;}
.filter-tabs button{
  flex:1;
  padding:9px;
  border-radius:10px;
  border:1px solid var(--border);
  background:var(--surface);
  color:var(--text-muted);
  font-size:13px;
  font-weight:600;
  cursor:pointer;
}
.filter-tabs button.active{background:var(--surface-2);color:var(--text);border-color:var(--orange);}

.entry{
  display:flex;
  align-items:center;
  gap:12px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:14px;
  padding:13px 14px;
  margin-bottom:10px;
}
.entry .dot{width:9px;height:9px;border-radius:50%;flex-shrink:0;}
.entry.sale .dot{background:var(--orange);}
.entry.expense .dot{background:var(--teal);}
.entry .body{flex:1;min-width:0;}
.entry .name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.entry .meta{font-size:12px;color:var(--text-muted);margin-top:2px;}
.entry .amt-wrap{text-align:right;flex-shrink:0;}
.entry .amt{font-family:var(--font-mono);font-weight:700;font-size:14px;}
.entry.sale .amt{color:var(--success);}
.entry.expense .amt{color:var(--danger);}
.entry .del{
  background:none;border:none;color:var(--text-muted);
  font-size:11px;margin-top:3px;cursor:pointer;padding:2px 0;
  font-family:var(--font-mono);
}
.entry .del:active{color:var(--danger);}

/* ---------- Tab bar ---------- */
.tabbar{
  position:fixed;
  bottom:0;left:0;right:0;
  max-width:480px;
  margin:0 auto;
  background:rgba(28,31,38,0.92);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--border);
  display:flex;
  padding:8px 6px calc(8px + env(safe-area-inset-bottom));
  z-index:20;
}
.tab-btn{
  flex:1;
  background:none;border:none;
  display:flex;flex-direction:column;align-items:center;gap:4px;
  padding:6px 2px;
  color:var(--text-muted);
  font-family:var(--font-body);
  font-size:10.5px;
  font-weight:600;
  cursor:pointer;
}
.tab-btn.active{color:var(--orange);}
.tab-btn svg{width:22px;height:22px;}

::-webkit-scrollbar{display:none;}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div>
      <div class="brand">3D <span>Printing</span></div>
      <div class="subtitle">SALES &amp; EXPENSES · MVR · SAVED ON THIS DEVICE</div>
    </div>
  </div>
  <main id="view"></main>
  <nav class="tabbar" id="tabbar"></nav>
</div>
<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

// ---------------- Data layer ----------------
let sales = [];
let expenses = [];
let dataReady = false;

const CATS_SALE = ["Keychains","Household Products","Toys","Custom Order","Other"];
const CATS_EXP = ["Materials (Filament)","Electricity","Printer Maintenance","Packaging","Marketing","Tools/Equipment","Transport","Other"];
const PAY_METHODS = ["Cash","Bank Transfer","BML","MIB","Other"];

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function todayStr(){ return new Date().toISOString().slice(0,10); }
function fmtMVR(n){
  n = Number(n)||0;
  return "MVR " + n.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});
}
function fmtDate(d){
  const dt = new Date(d+"T00:00:00");
  return dt.toLocaleDateString('en-GB',{day:'2-digit',month:'short'});
}

async function loadData(){
  try{
    const s = localStorage.getItem('spool-ledger-sales');
    sales = s ? JSON.parse(s) : [];
  }catch(e){ sales = []; }
  try{
    const e = localStorage.getItem('spool-ledger-expenses');
    expenses = e ? JSON.parse(e) : [];
  }catch(e){ expenses = []; }
  dataReady = true;
}
async function persistSales(){
  try{ localStorage.setItem('spool-ledger-sales', JSON.stringify(sales)); }
  catch(e){ showToast("Couldn't save — storage may be full or disabled"); }
}
async function persistExpenses(){
  try{ localStorage.setItem('spool-ledger-expenses', JSON.stringify(expenses)); }
  catch(e){ showToast("Couldn't save — storage may be full or disabled"); }
}

// ---------------- Toast ----------------
let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>t.classList.remove('show'), 1800);
}

// ---------------- Router ----------------
let currentTab = 'dashboard';
let historyFilter = 'all';

const ICONS = {
  dashboard: '<path d="M3 11.5L12 4l9 7.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9" stroke-linecap="round" stroke-linejoin="round"/>',
  sale: '<circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8" stroke-linecap="round"/>',
  expense: '<circle cx="12" cy="12" r="9"/><path d="M8 12h8" stroke-linecap="round"/>',
  history: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3.5 2" stroke-linecap="round" stroke-linejoin="round"/>'
};
function icon(name){
  return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">${ICONS[name]}</svg>`;
}

function renderTabbar(){
  const tabs = [
    {id:'dashboard', label:'Home', icon:'dashboard'},
    {id:'add-sale', label:'Add Sale', icon:'sale'},
    {id:'add-expense', label:'Add Expense', icon:'expense'},
    {id:'history', label:'History', icon:'history'},
  ];
  document.getElementById('tabbar').innerHTML = tabs.map(t=>`
    <button class="tab-btn ${currentTab===t.id?'active':''}" data-tab="${t.id}">
      ${icon(t.icon)}
      <span>${t.label}</span>
    </button>
  `).join('');
  document.querySelectorAll('.tab-btn').forEach(b=>{
    b.addEventListener('click', ()=>{ currentTab = b.dataset.tab; render(); });
  });
}

function navigate(tab){ currentTab = tab; render(); }

// ---------------- Computations ----------------
function monthKey(dateStr){ return dateStr.slice(0,7); } // YYYY-MM

function monthTotals(ym){
  const s = sales.filter(x=>monthKey(x.date)===ym).reduce((a,x)=>a+x.total,0);
  const e = expenses.filter(x=>monthKey(x.date)===ym).reduce((a,x)=>a+x.amount,0);
  return {sales:s, expenses:e, profit:s-e};
}

function categoryTotals(ym){
  const totals = {};
  CATS_SALE.forEach(c=>totals[c]=0);
  sales.filter(x=>monthKey(x.date)===ym).forEach(x=>{
    totals[x.category] = (totals[x.category]||0) + x.total;
  });
  return totals;
}

// ---------------- Views ----------------
function viewDashboard(){
  const ym = todayStr().slice(0,7);
  const t = monthTotals(ym);
  const marginPct = t.sales > 0 ? Math.max(0, Math.min(100, (t.profit/t.sales)*100)) : 0;
  const circumference = 2*Math.PI*46;
  const dash = (marginPct/100)*circumference;
  const monthLabel = new Date(ym+"-01T00:00:00").toLocaleDateString('en-US',{month:'long', year:'numeric'});

  const cats = categoryTotals(ym);
  const maxCat = Math.max(1, ...Object.values(cats));
  const catRows = CATS_SALE.filter(c=>cats[c] > 0).sort((a,b)=>cats[b]-cats[a]);

  return `
    <div class="section-label">This Month</div>
    <div class="gauge-card">
      <div class="gauge-wrap">
        <svg width="112" height="112" viewBox="0 0 112 112">
          <circle cx="56" cy="56" r="46" stroke="var(--surface-2)" stroke-width="10" fill="none"/>
          <circle cx="56" cy="56" r="46" stroke="url(#grad)" stroke-width="10" fill="none"
            stroke-linecap="round"
            stroke-dasharray="${dash} ${circumference}"/>
          <defs>
            <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="var(--orange)"/>
              <stop offset="100%" stop-color="var(--teal)"/>
            </linearGradient>
          </defs>
        </svg>
        <div class="gauge-center">
          <div class="label">Margin</div>
          <div class="pct">${t.sales>0 ? Math.round(marginPct)+'%' : '—'}</div>
        </div>
      </div>
      <div class="gauge-figures">
        <div class="month">${monthLabel}</div>
        <div class="figure-row"><span class="k">Sales</span><span class="v">${fmtMVR(t.sales)}</span></div>
        <div class="figure-row"><span class="k">Expenses</span><span class="v">${fmtMVR(t.expenses)}</span></div>
        <div class="figure-row"><span class="k">Profit</span><span class="v ${t.profit>=0?'pos':'neg'}">${fmtMVR(t.profit)}</span></div>
      </div>
    </div>

    <div class="quick-actions">
      <button class="qa-btn sale" data-nav="add-sale">
        <span class="qa-icon">${icon('sale')}</span>
        Log a Sale
      </button>
      <button class="qa-btn expense" data-nav="add-expense">
        <span class="qa-icon">${icon('expense')}</span>
        Log an Expense
      </button>
    </div>

    <div class="section-label">Sales by Category</div>
    ${catRows.length === 0 ? `<div class="cat-list"><div class="empty-note">No sales logged this month yet.</div></div>` : `
    <div class="cat-list">
      ${catRows.map(c=>`
        <div class="cat-row">
          <div class="cat-row-top"><span class="name">${c}</span><span class="amt">${fmtMVR(cats[c])}</span></div>
          <div class="cat-bar-track"><div class="cat-bar-fill" style="width:${Math.round((cats[c]/maxCat)*100)}%"></div></div>
        </div>
      `).join('')}
    </div>`}
  `;
}

function saleFieldRow(){
  return `
    <div class="field">
      <label>Item</label>
      <input type="text" id="f-item" placeholder="e.g. Cat keychain" autocomplete="off">
    </div>
    <div class="field">
      <label>Category</label>
      <select id="f-category">${CATS_SALE.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
    </div>
    <div class="row-2">
      <div class="field">
        <label>Quantity</label>
        <input type="number" id="f-qty" min="0" step="1" value="1" inputmode="numeric">
      </div>
      <div class="field">
        <label>Unit Price (MVR)</label>
        <input type="number" id="f-price" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
      </div>
    </div>
    <div class="total-preview">
      <span class="k">Total</span>
      <span class="v" id="f-total">MVR 0.00</span>
    </div>
    <div class="row-2">
      <div class="field">
        <label>Customer (optional)</label>
        <input type="text" id="f-customer" placeholder="Name" autocomplete="off">
      </div>
      <div class="field">
        <label>Payment</label>
        <select id="f-payment">${PAY_METHODS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      </div>
    </div>
    <div class="field">
      <label>Date</label>
      <input type="date" id="f-date" value="${todayStr()}">
    </div>
  `;
}

function viewAddSale(){
  return `
    <div class="section-label">Log a Sale</div>
    <div class="form-card">
      ${saleFieldRow()}
      <button class="submit-btn sale" id="submit-sale">Save Sale</button>
    </div>
  `;
}

function viewAddExpense(){
  return `
    <div class="section-label">Log an Expense</div>
    <div class="form-card">
      <div class="field">
        <label>Expense</label>
        <input type="text" id="f-name" placeholder="e.g. PLA filament 1kg" autocomplete="off">
      </div>
      <div class="field">
        <label>Category</label>
        <select id="f-category">${CATS_EXP.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label>Amount (MVR)</label>
        <input type="number" id="f-amount" min="0" step="0.01" placeholder="0.00" inputmode="decimal">
      </div>
      <div class="row-2">
        <div class="field">
          <label>Vendor (optional)</label>
          <input type="text" id="f-vendor" placeholder="Paid to" autocomplete="off">
        </div>
        <div class="field">
          <label>Payment</label>
          <select id="f-payment">${PAY_METHODS.map(c=>`<option value="${c}">${c}</option>`).join('')}</select>
        </div>
      </div>
      <div class="field">
        <label>Date</label>
        <input type="date" id="f-date" value="${todayStr()}">
      </div>
      <button class="submit-btn expense" id="submit-expense">Save Expense</button>
    </div>
  `;
}

function viewHistory(){
  let items = [];
  sales.forEach(x=>items.push({...x, type:'sale'}));
  expenses.forEach(x=>items.push({...x, type:'expense'}));
  items.sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));

  if(historyFilter !== 'all'){
    items = items.filter(x=>x.type===historyFilter);
  }

  return `
    <div class="section-label">History</div>
    <div class="filter-tabs">
      <button data-filter="all" class="${historyFilter==='all'?'active':''}">All</button>
      <button data-filter="sale" class="${historyFilter==='sale'?'active':''}">Sales</button>
      <button data-filter="expense" class="${historyFilter==='expense'?'active':''}">Expenses</button>
    </div>
    ${items.length===0 ? `<div class="empty-note">No entries yet. Log a sale or expense to see it here.</div>` :
      items.map(x=>{
        if(x.type==='sale'){
          return `
          <div class="entry sale">
            <div class="dot"></div>
            <div class="body">
              <div class="name">${escapeHtml(x.item)}</div>
              <div class="meta">${fmtDate(x.date)} · ${escapeHtml(x.category)} · ${x.qty} pc${x.qty==1?'':'s'}</div>
            </div>
            <div class="amt-wrap">
              <div class="amt">+${fmtMVR(x.total)}</div>
              <button class="del" data-del="sale" data-id="${x.id}">Delete</button>
            </div>
          </div>`;
        }else{
          return `
          <div class="entry expense">
            <div class="dot"></div>
            <div class="body">
              <div class="name">${escapeHtml(x.name)}</div>
              <div class="meta">${fmtDate(x.date)} · ${escapeHtml(x.category)}</div>
            </div>
            <div class="amt-wrap">
              <div class="amt">−${fmtMVR(x.amount)}</div>
              <button class="del" data-del="expense" data-id="${x.id}">Delete</button>
            </div>
          </div>`;
        }
      }).join('')
    }
  `;
}

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s==null?'':s;
  return d.innerHTML;
}

// ---------------- Render + bind ----------------
function render(){
  renderTabbar();
  const view = document.getElementById('view');
  if(!dataReady){
    view.innerHTML = `<div class="empty-note">Loading your ledger…</div>`;
    return;
  }
  if(currentTab==='dashboard') view.innerHTML = viewDashboard();
  else if(currentTab==='add-sale') view.innerHTML = viewAddSale();
  else if(currentTab==='add-expense') view.innerHTML = viewAddExpense();
  else if(currentTab==='history') view.innerHTML = viewHistory();
  bindView();
  window.scrollTo(0,0);
}

function bindView(){
  // dashboard quick actions
  document.querySelectorAll('[data-nav]').forEach(b=>{
    b.addEventListener('click', ()=>navigate(b.dataset.nav));
  });

  // add sale
  const qty = document.getElementById('f-qty');
  const price = document.getElementById('f-price');
  const totalEl = document.getElementById('f-total');
  function updateTotal(){
    if(!qty || !price || !totalEl) return;
    const t = (parseFloat(qty.value)||0) * (parseFloat(price.value)||0);
    totalEl.textContent = fmtMVR(t);
  }
  if(qty && price){
    qty.addEventListener('input', updateTotal);
    price.addEventListener('input', updateTotal);
    updateTotal();
  }
  const submitSale = document.getElementById('submit-sale');
  if(submitSale){
    submitSale.addEventListener('click', async ()=>{
      const item = document.getElementById('f-item').value.trim();
      const category = document.getElementById('f-category').value;
      const qtyVal = parseFloat(document.getElementById('f-qty').value)||0;
      const priceVal = parseFloat(document.getElementById('f-price').value)||0;
      const customer = document.getElementById('f-customer').value.trim();
      const payment = document.getElementById('f-payment').value;
      const date = document.getElementById('f-date').value || todayStr();
      if(!item){ showToast("Add an item name"); return; }
      if(qtyVal<=0 || priceVal<=0){ showToast("Add quantity and price"); return; }
      sales.push({
        id: uid(), date, item, category,
        qty: qtyVal, price: priceVal, total: qtyVal*priceVal,
        customer, payment
      });
      submitSale.disabled = true;
      await persistSales();
      submitSale.disabled = false;
      showToast("Sale saved ✓");
      navigate('dashboard');
    });
  }

  // add expense
  const submitExpense = document.getElementById('submit-expense');
  if(submitExpense){
    submitExpense.addEventListener('click', async ()=>{
      const name = document.getElementById('f-name').value.trim();
      const category = document.getElementById('f-category').value;
      const amount = parseFloat(document.getElementById('f-amount').value)||0;
      const vendor = document.getElementById('f-vendor').value.trim();
      const payment = document.getElementById('f-payment').value;
      const date = document.getElementById('f-date').value || todayStr();
      if(!name){ showToast("Add an expense name"); return; }
      if(amount<=0){ showToast("Add an amount"); return; }
      expenses.push({
        id: uid(), date, name, category, amount, vendor, payment
      });
      submitExpense.disabled = true;
      await persistExpenses();
      submitExpense.disabled = false;
      showToast("Expense saved ✓");
      navigate('dashboard');
    });
  }

  // history filters
  document.querySelectorAll('[data-filter]').forEach(b=>{
    b.addEventListener('click', ()=>{ historyFilter = b.dataset.filter; render(); });
  });

  // deletes
  document.querySelectorAll('[data-del]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const id = b.dataset.id;
      if(b.dataset.del === 'sale'){
        sales = sales.filter(x=>x.id!==id);
        await persistSales();
      }else{
        expenses = expenses.filter(x=>x.id!==id);
        await persistExpenses();
      }
      showToast("Deleted");
      render();
    });
  });
}

// ---------------- Init ----------------
(async function init(){
  render(); // show loading state immediately
  await loadData();
  render();
})();

})();
</script>
</body>
</html>
